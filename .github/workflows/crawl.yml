name: crawl-komyoji

# 光明寺教蔵（fc2）在中國網路被 IP 級封鎖，本機抓不到；
# 用 GitHub 的 runner（海外）代抓，再以 artifact 取回。
# 觸發：只用手動（workflow_dispatch）。push 不自動跑，免得每次改程式都重抓 4,627 章。
# 手動觸發見 docs/crawl-log.md §5。

on:
  workflow_dispatch:
    inputs:
      limit:
        description: '只抓前 N 章（0 = 全部）'
        required: false
        default: '0'

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 先確認 runner 連得到光明寺
        run: |
          set -x
          curl -sS -o /dev/null -w 'menu http=%{http_code} size=%{size_download}\n' \
            --max-time 60 https://komyojikyozo.web.fc2.com/menu.html

      - name: 抓取（Shift_JIS → UTF-8，gzip）
        run: |
          node src/crawl.mjs --out data/html --concurrency 6 --limit "${{ github.event.inputs.limit || '0' }}"

      - name: 統計
        if: always()
        run: |
          echo "--- 檔案數 ---"
          find data/html -name '*.gz' | wc -l
          echo "--- 大小 ---"
          du -sh data/html 2>/dev/null || true
          echo "--- manifest 前 5 列 ---"
          head -5 data/html/manifest.tsv 2>/dev/null || true
          echo "--- 失敗的章節 ---"
          awk -F'\t' 'NR>1 && $3 !~ /^(ok|cached)$/ {c++} END {print (c+0) " failed"}' data/html/manifest.tsv 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: komyoji-html
          path: data/html
          retention-days: 30
          compression-level: 0
